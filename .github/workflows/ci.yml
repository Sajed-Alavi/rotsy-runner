name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: Lint (defect-focused rule set)
        run: ruff check src tests
      - name: Formatting
        run: ruff format --check src tests
      - name: Tests
        run: pytest -q --cov=rotsy_runner --cov-report=term-missing
      - name: Dependency CVE audit
        run: pip-audit -r requirements.txt

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wheel, sdist and offline bundle
        run: pip install build==1.3.0 && scripts/build-release.sh
      - name: Runtime image
        run: docker build --target base -t rotsy-runner:ci .
      - name: Test image
        run: docker build --target test -t rotsy-runner-test:ci . && docker run --rm rotsy-runner-test:ci
      - name: Image ships no scanner binaries
        run: |
          ! docker run --rm --entrypoint sh rotsy-runner:ci -c 'command -v trivy || command -v grype'
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
