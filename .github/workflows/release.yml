name: release

# Tag vX.Y.Z (matching src/rotsy_runner/__init__.py) to publish:
#   * wheel, sdist and offline install bundles (amd64 + arm64) with SHA256SUMS
#     attached to the GitHub release;
#   * the container image ghcr.io/sajed-alavi/rotsy-runner:<version> and :latest.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version matches the tag
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/rotsy_runner/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME"
      - name: Test
        run: pip install -r requirements-dev.txt && pip install --no-deps -e . && pytest -q
      - name: Build (amd64 bundle)
        run: scripts/build-release.sh && mkdir -p dist && cp release/* dist/
      - name: Build (arm64 bundle)
        run: |
          PLATFORM=manylinux2014_aarch64 scripts/build-release.sh
          cp release/rotsy-runner-*-bundle-*aarch64.tar.gz dist/
          (cd dist && rm -f SHA256SUMS && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sajed-alavi/rotsy-runner:${{ github.ref_name }}
            ghcr.io/sajed-alavi/rotsy-runner:latest
